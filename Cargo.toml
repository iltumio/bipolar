[package]
name = "bipolar"
version = "0.1.0"
edition = "2024"
description = "Folder-scoped Git identities and GitHub authentication for Linux"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"], optional = true }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
