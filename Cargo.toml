[package]
name = "bipolar"
version = "0.3.0"
edition = "2024"
description = "Give personal and work folders their own Git identity and GitHub authentication"
license = "MIT OR Apache-2.0"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:rfd", "dep:unicode-segmentation"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
gpui = { version = "0.2.2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = { version = "1.12", optional = true }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
